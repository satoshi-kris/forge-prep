name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject.toml version matches tag
        run: |
          python -c '
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          tag_version = tag.lstrip("v")
          if pyproject_version != tag_version:
              print(
                  f"ERROR: pyproject.toml version ({pyproject_version!r}) does not match "
                  f"tag {tag!r} (stripped to {tag_version!r}). "
                  f"Bump [project].version in pyproject.toml before tagging.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"OK: pyproject.toml version {pyproject_version!r} matches tag {tag!r}.")
          '

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check dist
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/forge-prep
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
