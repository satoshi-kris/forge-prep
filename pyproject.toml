[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-prep"
version = "0.1.1"
description = "Data readiness toolkit for Mistral Forge — audit, clean, and prepare enterprise data for custom model training. forge-prep is an independent open-source project. It is not affiliated with, endorsed by, or sponsored by Mistral AI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Kris"}
]
keywords = ["mistral", "forge", "data-quality", "llm", "enterprise-ai", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
forge-prep = "forge_prep.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/satoshi-kris/forge-prep"
Repository = "https://github.com/satoshi-kris/forge-prep"
Issues = "https://github.com/satoshi-kris/forge-prep/issues"
Documentation = "https://github.com/satoshi-kris/forge-prep#readme"

[tool.setuptools.packages.find]
include = ["forge_prep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=forge_prep --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py310"
# 120 was never actually enforced pre-Phase-1 — natural-language string
# literals (recommendation text, test fixtures) routinely ran past it.
# Widened to match reality rather than mass-reformatting unrelated prose.
line-length = 175
# examples/sample-corpus and the token holdout set are deliberately messy
# *input data* for the tool to audit, not source code. Linting them would
# force us to clean the very defects the fixtures exist to demonstrate.
extend-exclude = ["examples/", "tests/fixtures/token_holdout/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
